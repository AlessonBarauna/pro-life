name: FC27 A01.29 Match Calendar Audit
run-name: FC27 A01.29 - ${{ github.ref_name }}
on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/fc27-career-global-audit
    paths:
      - '.github/workflows/fc27-a01-29.yml'
      - 'tests/**'
      - 'src/**'
      - 'package*.json'
  push:
    branches:
      - automation/fc27-a01-29-match-calendar
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run isolated match and calendar regression
        shell: bash
        run: |
          mkdir -p a01-29-results
          failures=0
          echo '## A01.29 - Match and Calendar' >> "$GITHUB_STEP_SUMMARY"
          echo '| Suite | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          while IFS='|' read -r label file; do
            [ -n "$label" ] || continue
            echo "::group::$label"
            set +e
            node --test --test-reporter=tap "$file" > "a01-29-results/$label.tap" 2>&1
            code=$?
            set -e
            cat "a01-29-results/$label.tap"
            echo "::endgroup::"
            if [ "$code" -eq 0 ]; then result=PASS; else result=FAIL; failures=$((failures+1)); fi
            printf '%s,%s,%s,%s\n' "$label" "$file" "$result" "$code" >> a01-29-results/summary.csv
            echo "| $label | $result (exit $code) |" >> "$GITHUB_STEP_SUMMARY"
          done <<'TESTS'
          calendar-core|tests/calendar-stage4.test.cjs
          season-calendar-ui|tests/season-calendar-ui-stage31.test.cjs
          coach-incremental-match|tests/coach-incremental-match-v2.test.cjs
          official-match-finalization|tests/coach-official-live-finalization.test.cjs
          TESTS
          echo "Failing suites: $failures" >> "$GITHUB_STEP_SUMMARY"
          test "$failures" -eq 0
      - name: Upload TAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fc27-a01-29-tap
          path: a01-29-results/
          if-no-files-found: warn
          retention-days: 30
